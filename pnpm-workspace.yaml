packages:
  - 'apps/*'
  - 'packages/*'
  - 'turbo/generators'

allowBuilds:
  core-js-pure: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

autoInstallPeers: true

# Prevent concurrent implicit installs when Turbo runs multiple package scripts
verifyDepsBeforeRun: error

publicHoistPattern:
  - '*prettier*'
  - oxlint
  - oxlint-tsgolint
  - '@typescript/native-preview'

configDependencies:
  '@pnpm/trusted-deps': 0.1.1+sha512-jI3PWNv2zCg9+KHI3qQTsa534c5nisZQrHFeWSyyHoUXcuzvjkXxQKPFLJ/qtNAF+PtKHDlRntO2aZKb3VDuHQ==

onlyBuiltDependenciesFile: node_modules/.pnpm-config/@pnpm/trusted-deps/allow.json
